name: ui-tests
on:
  pull_request:
  schedule:
    - cron: "30 20 * * *"       # nightly full run
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: maven }
      - name: Install browsers
        run: mvn -q -B test-compile exec:java -e -Dexec.classpathScope=test -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"
      - name: Run tests (smoke on PRs, full otherwise)
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          RECEIVER_PASSWORD: ${{ secrets.RECEIVER_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then MVN_GROUPS="-Dgroups=smoke"; fi
          mvn -B test $MVN_GROUPS
      - name: Build HTML report
        if: always()
        run: mvn -B surefire-report:report-only
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            target/site/surefire-report.html
            target/surefire-reports
            reports
